[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-assessment-engine"
version = "0.1.0"
description = "Evidence-grounded airline risk research workflow"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6,<1.0",
    "openai>=1.40,<3.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tavily-python>=0.7,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
risk-assessment = "risk_assessment_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]